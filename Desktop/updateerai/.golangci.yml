run:
  timeout: 5m
  tests: true

linters:
  enable:
    - goimports
    - govet
    - errcheck
    - gosimple
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - prealloc
    - gofmt
    - gocyclo

linters-settings:
  gofmt:
    reformat-codes: true
  goimports:
    local-prefixes: github.com/AuditorPraise/updateer-ai
  gocyclo:
    min-complexity: 15

issues:
  exclude-rules:
    - path: _test\.go$
      linters:
        - gocyclo
        - errcheck
    - linters:
        - gosimple
      text: "should use `errors.Is\\((.+), io.EOF\\)`"
