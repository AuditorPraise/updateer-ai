apiVersion: v1
kind: ConfigMap
metadata:
  name: updateer-config
data:
  # General Config
  APP_URL: "https://app.updateerai.fun"
  CLOUDFLARE_TUNNEL_URL: "https://logos.updateerai.fun"
  
  # Google Cloud
  GOOGLE_CLOUD_PROJECT: "studio-7394868738-b96a2"
